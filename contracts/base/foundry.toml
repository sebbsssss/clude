[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

# Base Sepolia (testnet, chainId 84532) + Base mainnet (8453).
# RPC URLs + the deployer key are supplied via env (never committed):
#   BASE_SEPOLIA_RPC_URL, BASE_RPC_URL, and the key from contracts/base/.deployer.env
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }
